const{useState,useEffect,useRef}=React;

function FadeIn({children,delay=0}){
  const ref=useRef(null);const[vis,setVis]=useState(false);
  useEffect(()=>{const el=ref.current;if(!el)return;const ob=new IntersectionObserver(([e])=>{if(e.isIntersecting){setVis(true);ob.disconnect();}},{threshold:0.12});ob.observe(el);return()=>ob.disconnect();},[]);
  return <div ref={ref} style={{opacity:vis?1:0,transform:vis?"translateY(0)":"translateY(40px)",transition:`opacity .7s ease ${delay}s, transform .7s ease ${delay}s`}}>{children}</div>;
}

function StackedCard({pr,offset,onClick}){
  const absOff=Math.abs(offset);
  if(absOff>2)return null;
  return <div onClick={onClick} style={{
    position:"absolute",width:360,height:380,background:pr.gradient,borderRadius:20,padding:"32px 28px",
    cursor:offset===0?"default":"pointer",transition:"all .5s cubic-bezier(.25,.1,.25,1)",
    transform:offset===0?"translateX(0) scale(1) rotateY(0deg)":offset<0?`translateX(${offset*50-20}px) scale(${0.88-absOff*0.04}) rotateY(8deg)`:`translateX(${offset*50+20}px) scale(${0.88-absOff*0.04}) rotateY(-8deg)`,
    opacity:offset===0?1:absOff===1?0.6:0.3,zIndex:10-absOff,
    filter:offset===0?"none":`brightness(${0.5-absOff*0.1})`,
    boxShadow:offset===0?`0 20px 60px rgba(0,0,0,.5), 0 0 40px ${pr.accent}15`:"0 4px 20px rgba(0,0,0,.3)",
    overflow:"hidden",display:"flex",flexDirection:"column",pointerEvents:absOff>1?"none":"auto"}}>
    <div style={{position:"absolute",top:-40,right:-40,width:140,height:140,borderRadius:"50%",background:`radial-gradient(circle, ${pr.accent}20 0%, transparent 70%)`}}/>
    <div style={{position:"relative",zIndex:1,flex:1,display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:11,fontWeight:500,color:pr.accent,letterSpacing:".06em",textTransform:"uppercase",marginBottom:10,opacity:.9}}>{pr.subtitle}</div>
      <h3 style={{fontSize:22,fontWeight:700,color:"#fff",margin:"0 0 10px",letterSpacing:"-.02em",lineHeight:1.2}}>{pr.title}</h3>
      <p style={{fontSize:13,color:"rgba(255,255,255,.6)",lineHeight:1.5,flex:1}}>{pr.desc}</p>
      <div style={{display:"inline-flex",alignItems:"baseline",gap:8,background:"rgba(255,255,255,.08)",borderRadius:10,padding:"10px 14px",border:"1px solid rgba(255,255,255,.1)",alignSelf:"flex-start",marginTop:12}}>
        <span style={{fontSize:20,fontWeight:700,color:pr.accent}}>{pr.stat}</span>
        <span style={{fontSize:11,color:"rgba(255,255,255,.5)"}}>{pr.statLabel}</span>
      </div>
    </div>
  </div>;
}

function MobileCard({pr,offset,onClick}){

  return <div onClick={onClick} style={{
    position:"absolute",width:"85%",maxWidth:320,height:300,background:pr.gradient,borderRadius:16,padding:"24px 20px",
    cursor:offset===0?"default":"pointer",transition:"all .5s cubic-bezier(.25,.1,.25,1)",
    transform:offset===0?"translateX(0) scale(1) rotateY(0deg)":offset<0?`translateX(${offset*40-16}px) scale(${0.88-absOff*0.04}) rotateY(6deg)`:`translateX(${offset*40+16}px) scale(${0.88-absOff*0.04}) rotateY(-6deg)`,
    opacity:offset===0?1:absOff===1?0.5:0.2,zIndex:10-absOff,
    filter:offset===0?"none":`brightness(${0.45-absOff*0.1})`,
    boxShadow:offset===0?`0 16px 48px rgba(0,0,0,.5), 0 0 30px ${pr.accent}15`:"0 4px 16px rgba(0,0,0,.3)",
    overflow:"hidden",display:"flex",flexDirection:"column",pointerEvents:absOff>1?"none":"auto"}}>
    <div style={{position:"absolute",top:-30,right:-30,width:120,height:120,borderRadius:"50%",background:`radial-gradient(circle, ${pr.accent}20 0%, transparent 70%)`}}/>
    <div style={{position:"relative",zIndex:1,flex:1,display:"flex",flexDirection:"column"}}>
      <div style={{fontSize:10,fontWeight:500,color:pr.accent,letterSpacing:".06em",textTransform:"uppercase",marginBottom:8}}>{pr.subtitle}</div>
      <h3 style={{fontSize:18,fontWeight:700,color:"#fff",margin:"0 0 8px",letterSpacing:"-.02em",lineHeight:1.2}}>{pr.title}</h3>
      <p style={{fontSize:12,color:"rgba(255,255,255,.6)",lineHeight:1.5,flex:1}}>{pr.desc}</p>
      <div style={{display:"inline-flex",alignItems:"baseline",gap:6,background:"rgba(255,255,255,.08)",borderRadius:8,padding:"8px 12px",border:"1px solid rgba(255,255,255,.1)",alignSelf:"flex-start",marginTop:8}}>
        <span style={{fontSize:16,fontWeight:700,color:pr.accent}}>{pr.stat}</span>
        <span style={{fontSize:10,color:"rgba(255,255,255,.5)"}}>{pr.statLabel}</span>
      </div>
    </div>
  </div>;
}

function NavDots({active,total,onSelect,onPrev,onNext}){
  return <div style={{display:"flex",justifyContent:"center",alignItems:"center",gap:10}}>
    <button onClick={onPrev} disabled={active===0} style={{width:32,height:32,borderRadius:"50%",border:"1px solid rgba(255,255,255,.15)",background:active===0?"transparent":"rgba(255,255,255,.06)",cursor:active===0?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:active===0?0.3:1,transition:"all .2s"}}>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </button>
    <div style={{display:"flex",gap:5}}>
      {Array.from({length:total}).map((_,i)=><div key={i} onClick={()=>onSelect(i)} style={{width:i===active?20:6,height:6,borderRadius:3,background:i===active?"#64ffda":"rgba(255,255,255,.2)",cursor:"pointer",transition:"all .3s"}}/>)}
    </div>
    <button onClick={onNext} disabled={active===total-1} style={{width:32,height:32,borderRadius:"50%",border:"1px solid rgba(255,255,255,.15)",background:active===total-1?"transparent":"rgba(255,255,255,.06)",cursor:active===total-1?"default":"pointer",display:"flex",alignItems:"center",justifyContent:"center",opacity:active===total-1?0.3:1,transition:"all .2s"}}>
      <svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M6 3l5 5-5 5" stroke="#fff" strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/></svg>
    </button>
  </div>;
}

function DetailPanel({p,d}){
  return <div key={p.id} style={{animation:"fadeUp .4s ease"}}>
    <div style={{fontSize:11,fontWeight:500,color:p.accent,letterSpacing:".06em",textTransform:"uppercase",marginBottom:8}}>{p.subtitle}</div>
    <h3 style={{fontSize:28,fontWeight:700,color:"#fff",margin:"0 0 20px",letterSpacing:"-.02em"}}>{p.title}</h3>
    <div style={{display:"flex",gap:12,marginBottom:24,flexWrap:"wrap"}}>
      {d.metrics.map((m,i)=><div key={i} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:12,padding:"14px 18px",flex:1,minWidth:120}}>
        <div style={{fontSize:22,fontWeight:700,color:"#fff",letterSpacing:"-.02em"}}>{m.val}</div>
        <div style={{fontSize:11,color:"rgba(255,255,255,.45)",marginTop:2}}>{m.label}</div>
      </div>)}
    </div>
    <div style={{marginBottom:20}}>
      <div style={{fontSize:12,fontWeight:600,color:"#ff6b6b",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="6.5" stroke="#ff6b6b" strokeWidth="1.2"/><path d="M8 5v3.5M8 10.5v.5" stroke="#ff6b6b" strokeWidth="1.3" strokeLinecap="round"/></svg>
        Why it matters</div>
      <p style={{fontSize:14,color:"rgba(255,255,255,.7)",lineHeight:1.7,margin:0}}>{d.problem}</p>
    </div>
    <div>
      <div style={{fontSize:12,fontWeight:600,color:"#64ffda",marginBottom:8,display:"flex",alignItems:"center",gap:6}}>
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 8h10m0 0l-3-3m3 3l-3 3" stroke="#64ffda" strokeWidth="1.3" strokeLinecap="round" strokeLinejoin="round"/></svg>
        How I solved it</div>
      {d.approach.map((a,i)=><div key={i} style={{display:"flex",gap:10,marginBottom:10,alignItems:"flex-start"}}>
        <div style={{width:20,height:20,borderRadius:"50%",background:"#64ffda",color:"#0a0e27",fontSize:10,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
        <span style={{fontSize:13,color:"rgba(255,255,255,.65)",lineHeight:1.6}}>{a}</span>
      </div>)}
    </div>
  </div>;
}

function MobileDetail({p,d}){
  return <div style={{marginBottom:16}}>
    <div style={{display:"flex",gap:8,marginBottom:16,flexWrap:"wrap"}}>
      {d.metrics.map((m,i)=><div key={i} style={{background:"rgba(255,255,255,.04)",border:"1px solid rgba(255,255,255,.08)",borderRadius:10,padding:"10px 14px",flex:1,minWidth:80}}>
        <div style={{fontSize:18,fontWeight:700,color:"#fff"}}>{m.val}</div>
        <div style={{fontSize:10,color:"rgba(255,255,255,.4)"}}>{m.label}</div>
      </div>)}

    <p style={{fontSize:13,color:"rgba(255,255,255,.65)",lineHeight:1.6,marginBottom:14}}>{d.problem}</p>
    <div style={{fontSize:12,fontWeight:600,color:"#64ffda",marginBottom:6}}>How I solved it</div>
    {d.approach.map((a,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:8}}>
      <div style={{width:18,height:18,borderRadius:"50%",background:"#64ffda",color:"#0a0e27",fontSize:9,fontWeight:700,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,marginTop:2}}>{i+1}</div>
      <span style={{fontSize:12,color:"rgba(255,255,255,.6)",lineHeight:1.5}}>{a}</span>
    </div>)}

function ProductShowcase(){
  const[active,setActive]=useState(0);
  const touchX=useRef(0);
  const p=products[active],d=details[active];
  const next=()=>setActive(i=>Math.min(i+1,products.length-1));
  const prev=()=>setActive(i=>Math.max(i-1,0));
  const onTS=e=>{touchX.current=e.changedTouches[0].screenX};
  const onTE=e=>{const diff=touchX.current-e.changedTouches[0].screenX;if(diff>50)next();if(diff<-50)prev();};

  return <div>
    {/* Desktop */}
    <div className="showcase-desktop" style={{display:"flex",gap:32,minHeight:480}}>
      <div style={{width:420,flexShrink:0,position:"relative"}} onTouchStart={onTS} onTouchEnd={onTE}>
        <div style={{position:"relative",height:420,display:"flex",alignItems:"center",justifyContent:"center"}}>
          {products.map((pr,i)=><StackedCard key={pr.id} pr={pr} offset={i-active} onClick={()=>setActive(i)}/>)}
        </div>
        <NavDots active={active} total={products.length} onSelect={setActive} onPrev={prev} onNext={next}/>
        <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,.3)",marginTop:6}}>{active+1} / {products.length}</div>
      </div>
      <div style={{flex:1,paddingTop:8}}><DetailPanel p={p} d={d}/></div>
    </div>
    {/* Mobile */}
    <div className="showcase-mobile" onTouchStart={onTS} onTouchEnd={onTE}>
      <div style={{position:"relative",height:340,display:"flex",alignItems:"center",justifyContent:"center",marginBottom:20}}>
        {products.map((pr,i)=><MobileCard key={pr.id} pr={pr} offset={i-active} onClick={()=>setActive(i)}/>)}
      </div>
      <MobileDetail p={p} d={d}/>
      <NavDots active={active} total={products.length} onSelect={setActive} onPrev={prev} onNext={next}/>
      <div style={{textAlign:"center",fontSize:11,color:"rgba(255,255,255,.3)",marginTop:6}}>Swipe or tap arrows · {active+1} / {products.length}</div>
    </div>
  </div>;
}

function Site(){
  const[scrollY,setScrollY]=useState(0);
  useEffect(()=>{const fn=()=>setScrollY(window.scrollY);window.addEventListener("scroll",fn,{passive:true});return()=>window.removeEventListener("scroll",fn);},[]);
  const scrollTo=id=>document.getElementById(id)?.scrollIntoView({behavior:"smooth"});

  return <div style={{fontFamily:"-apple-system,'SF Pro Display','Helvetica Neue',Helvetica,Arial,sans-serif",background:"#0a0e27",color:"#e8e8e8",overflowX:"hidden"}}>

    <nav className="nav-wrap" style={{position:"fixed",top:0,left:0,right:0,zIndex:100,background:scrollY>50?"rgba(10,14,39,.88)":"transparent",backdropFilter:scrollY>50?"saturate(180%) blur(20px)":"none",borderBottom:scrollY>50?"1px solid rgba(255,255,255,.06)":"none",transition:"all .3s",padding:"0 40px"}}>
      <div style={{maxWidth:1200,margin:"0 auto",display:"flex",justifyContent:"space-between",alignItems:"center",height:56}}>
        <span style={{fontSize:16,fontWeight:700,letterSpacing:"-.02em",cursor:"pointer",color:"#fff"}} onClick={()=>scrollTo("hero")}>Yun Chen</span>
        <div className="nav-links" style={{display:"flex",gap:28,alignItems:"center"}}>
          {[["Work","work"],["Experience","experience"]].map(([l,id])=><span key={id} onClick={()=>scrollTo(id)} className="nav-link" style={{fontSize:13,color:"rgba(255,255,255,.6)",cursor:"pointer",fontWeight:400}}>{l}</span>)}
          <a href="https://www.linkedin.com/in/yun-chen-6b22a448/" target="_blank" rel="noreferrer" className="nav-link" style={{fontSize:13,color:"#64ffda",textDecoration:"none",fontWeight:500}}>LinkedIn ↗</a>
        </div>
      </div>
    </nav>

    <section id="hero" className="hero-section" style={{minHeight:"100vh",display:"flex",alignItems:"center",padding:"120px 40px 80px",position:"relative"}}>
      <div style={{position:"absolute",top:"5%",left:"15%",width:500,height:500,borderRadius:"50%",background:"radial-gradient(circle, rgba(100,255,218,.08) 0%, transparent 70%)",animation:"float 8s ease-in-out infinite",pointerEvents:"none"}}/>
      <div style={{position:"absolute",bottom:"15%",left:"5%",width:400,height:400,borderRadius:"50%",background:"radial-gradient(circle, rgba(0,113,227,.1) 0%, transparent 70%)",animation:"float 6s ease-in-out infinite 2s",pointerEvents:"none"}}/>
      <div className="hero-grid" style={{maxWidth:1200,width:"100%",margin:"0 auto",display:"grid",gridTemplateColumns:"1fr 1fr",gap:60,alignItems:"center",position:"relative",zIndex:1}}>
        <div>
          <FadeIn><div className="hero-badge" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"6px 16px",borderRadius:24,border:"1px solid rgba(100,255,218,.25)",background:"rgba(100,255,218,.05)",marginBottom:32}}>
            <span style={{color:"#64ffda",fontSize:14}}>✦</span><span style={{fontSize:13,color:"#a8e6d9",fontWeight:500}}>AI Product Manager · PayPal · San Jose, CA</span>
          </div></FadeIn>
          <FadeIn delay={0.1}><h1 className="hero-name" style={{fontSize:90,fontWeight:700,letterSpacing:"-.05em",lineHeight:1,margin:"0 0 24px",color:"#fff"}}>Yun Chen</h1></FadeIn>
          <FadeIn delay={0.2}><h2 className="hero-tagline" style={{fontSize:32,fontWeight:600,letterSpacing:"-.02em",lineHeight:1.2,margin:"0 0 18px",color:"rgba(255,255,255,.9)"}}>Delivering <span style={{background:"linear-gradient(135deg, #64ffda 0%, #40a9ff 100%)",WebkitBackgroundClip:"text",WebkitTextFillColor:"transparent"}}>AI at scale</span></h2></FadeIn>
          <FadeIn delay={0.3}><div className="cta-buttons" style={{display:"flex",gap:12,alignItems:"center",marginTop:8}}>
            <button onClick={()=>scrollTo("work")} style={{padding:"14px 32px",borderRadius:40,background:"linear-gradient(135deg, #64ffda 0%, #40a9ff 100%)",color:"#0a0e27",border:"none",fontSize:15,fontWeight:600,cursor:"pointer",transition:"transform .2s, box-shadow .2s"}} onMouseEnter={e=>{e.target.style.transform="scale(1.04)";e.target.style.boxShadow="0 8px 30px rgba(100,255,218,.3)"}} onMouseLeave={e=>{e.target.style.transform="scale(1)";e.target.style.boxShadow="none"}}>Explore my work ↓</button>
            <a href="https://www.linkedin.com/in/yun-chen-6b22a448/" target="_blank" rel="noreferrer" style={{padding:"14px 28px",borderRadius:40,background:"transparent",color:"#fff",border:"1.5px solid rgba(255,255,255,.2)",fontSize:15,fontWeight:500,textDecoration:"none",cursor:"pointer",display:"inline-flex",alignItems:"center",gap:6,transition:"border-color .2s"}} onMouseEnter={e=>e.currentTarget.style.borderColor="#64ffda"} onMouseLeave={e=>e.currentTarget.style.borderColor="rgba(255,255,255,.2)"}>LinkedIn</a>
          </div></FadeIn>
          <FadeIn delay={0.4}><div className="hero-stats" style={{display:"flex",gap:40,marginTop:64,flexWrap:"wrap"}}>
            {[{v:"9",l:"AI Products"},{v:"$26M+",l:"Impact"},{v:"~50%",l:"Efficiency"},{v:"10+",l:"Years"}].map((m,i)=><div key={i}><div className="hero-stat-val" style={{fontSize:32,fontWeight:700,letterSpacing:"-.03em",color:"#fff"}}>{m.v}</div><div style={{fontSize:12,color:"rgba(255,255,255,.4)",marginTop:2}}>{m.l}</div></div>)}
          </div></FadeIn>
        </div>
        <div className="hero-right"/>
      </div>
    </section>

    <section id="work" className="work-section" style={{padding:"40px 40px 100px"}}>
      <div style={{maxWidth:1100,margin:"0 auto"}}>
        <FadeIn><div style={{marginBottom:48}}>
          <span style={{fontSize:13,fontWeight:600,color:"#64ffda",letterSpacing:".04em"}}>PRODUCT PORTFOLIO</span>
          <h2 className="section-h2" style={{fontSize:44,fontWeight:700,letterSpacing:"-.03em",margin:"4px 0 8px",color:"#fff"}}>Case Studies</h2>
          <p style={{fontSize:17,color:"rgba(255,255,255,.5)",margin:0}}>AI products I built from concept to production</p>
        </div></FadeIn>
        <ProductShowcase/>
      </div>
    </section>

    <section id="experience" className="experience-section" style={{background:"rgba(255,255,255,.02)",padding:"100px 40px",borderTop:"1px solid rgba(255,255,255,.05)",borderBottom:"1px solid rgba(255,255,255,.05)"}}>
      <div style={{maxWidth:900,margin:"0 auto"}}>
        <FadeIn><span style={{fontSize:13,fontWeight:600,color:"#64ffda",letterSpacing:".04em"}}>CAREER</span><h2 className="section-h2" style={{fontSize:44,fontWeight:700,letterSpacing:"-.03em",margin:"4px 0 56px",color:"#fff"}}>Experience</h2></FadeIn>
        {jobs.map((j,i)=><FadeIn key={i} delay={i*0.08}>
          <div className="exp-row" style={{display:"grid",gridTemplateColumns:"200px 1fr",gap:32,paddingBottom:40,marginBottom:40,borderBottom:i<jobs.length-1?"1px solid rgba(255,255,255,.06)":"none"}}>
            <div className="exp-meta"><div style={{fontSize:13,color:"rgba(255,255,255,.5)",fontWeight:500}}>{j.date}</div><div style={{fontSize:13,color:"rgba(255,255,255,.4)",marginTop:2}}>{j.loc}</div></div>
            <div><h3 className="exp-title" style={{fontSize:20,fontWeight:600,margin:"0 0 2px",letterSpacing:"-.01em",color:"#fff"}}>{j.title}</h3>
              <div style={{fontSize:15,color:"rgba(255,255,255,.55)",marginBottom:14}}>{j.company} · {j.sub}</div>
              <div style={{display:"flex",gap:8,flexWrap:"wrap"}}>{j.highlights.map((h,hi)=><span key={hi} style={{fontSize:12,fontWeight:500,padding:"4px 12px",borderRadius:20,background:"rgba(100,255,218,.08)",color:"#a8e6d9",border:"1px solid rgba(100,255,218,.15)"}}>{h}</span>)}</div>
            </div>
          </div>
        </FadeIn>)}
      </div>
    </section>

    <section className="footer-section" style={{background:"rgba(0,0,0,.4)",padding:"80px 40px",textAlign:"center",borderTop:"1px solid rgba(255,255,255,.05)"}}>
      <FadeIn>
        <h2 className="footer-h2" style={{fontSize:40,fontWeight:700,color:"#fff",letterSpacing:"-.03em",margin:"0 0 12px"}}>Let's connect</h2>
        <p style={{fontSize:17,color:"rgba(255,255,255,.5)",marginBottom:32}}>Open to AI product leadership roles and advisory opportunities</p>
        <a href="https://www.linkedin.com/in/yun-chen-6b22a448/" target="_blank" rel="noreferrer" style={{display:"inline-flex",alignItems:"center",gap:8,padding:"14px 32px",borderRadius:40,background:"linear-gradient(135deg, #64ffda 0%, #40a9ff 100%)",color:"#0a0e27",fontSize:15,fontWeight:600,textDecoration:"none",transition:"transform .2s"}} onMouseEnter={e=>e.target.style.transform="scale(1.04)"} onMouseLeave={e=>e.target.style.transform="scale(1)"}>LinkedIn ↗</a>
      </FadeIn>
      <div style={{marginTop:48,paddingTop:24,borderTop:"1px solid rgba(255,255,255,.05)",fontSize:12,color:"rgba(255,255,255,.25)"}}>© 2025 Yun Chen. All rights reserved.</div>
    </section>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<Site/>);
</script>
</body>
</html>
